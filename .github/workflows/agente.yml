name: Agente Monitoramento Streamlit

on:
  schedule:
    - cron: '1 3 * * *'    # 00:01 horário de Brasília (UTC-3)
    - cron: '1 9 * * *'    # 06:01 horário de Brasília
    - cron: '1 15 * * *'   # 12:01 horário de Brasília
    - cron: '1 21 * * *'   # 18:01 horário de Brasília
  workflow_dispatch:         # Permite rodar manualmente pelo GitHub

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Executar agente
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
        run: python agente.py